), three dragons (Red 中, Green 發, White), and 8 flower tiles.',"Flowers are not played in your hand. When you draw one it is set aside face up and you draw a replacement from the back of the wall. Flowers score bonus points when you win."]},{title:"Taking a turn",paragraphs:["On your turn you draw a tile from the wall, then discard one tile face up — so your hand always stays at 13 tiles between turns.","Play moves counter-clockwise: you, then the player to your right, and so on. On screen: You → right player → top player → left player.",`You win by completing 4 sets + a pair, either by drawing your winning tile yourself (self-draw, "zi mo" 自摸) or by claiming another player's discard ("sik wu" 食糊).`]},{title:"Claiming discards",paragraphs:["When someone discards a tile you need, you may be able to claim it instead of drawing:","SEUNG 上 (chow): take the discard to complete a run of 3 — but ONLY from the player right before you (the player on your left on screen).","PONG 碰: take the discard to complete 3 matching tiles — from ANY player. This interrupts the turn order; play continues to your right afterwards.","GONG 槓: take the discard to complete 4 matching tiles — from any player. You draw a replacement tile from the back of the wall, and it earns a fan.","WIN 食: if the discard completes your whole hand, claim it and win! Winning beats every other claim.","Claim priority: WIN beats pong/gong, and pong/gong beat seung. If you ask for a seung and another player pongs the same tile, their claim wins — the coach will tell you when that happens.",'Claimed sets are placed face up beside your hand. They still count toward your 4 sets, but your hand is no longer "concealed" (concealed hands earn a bonus fan).']},{title:"Gongs from your own hand",paragraphs:["If you hold all four of a tile, you can declare a CONCEALED gong on your turn: the four tiles are set aside (shown face down) and you draw a replacement from the back of the wall. It keeps your hand concealed and earns a fan.","If you drew the 4th tile matching a pong you already claimed, you can ADD it to that pong (an added gong) — but beware: if another player needs that exact tile to win, they can ROB your gong and take the win."]},{title:'Ready ("ting" 聽牌)',paragraphs:['When you are one tile away from a complete hand, you are "ready". The coach tells you which tiles complete your hand — try to keep the widest wait you can.',"If the wall runs out before anyone wins, the hand is a draw: nobody scores and the same dealer deals again."]},{title:"Scoring & the match",paragraphs:['Winning hands score fan (番). Payouts double with every fan: 1 fan = 2 chips, 3 fan = 8, 10 fan = 1024… capped at the 13-fan limit. A "chicken hand" (gai wu 鸡糊 — mixed runs and triplets with no pattern) scores 0 fan and wins just 1 chip.',"If you win from a discard, only the discarder pays you. If you win by self-draw, all three opponents pay — and self-draw itself is worth a fan.","A full match is 4 rounds — East, South, West, North. The deal passes to the right whenever the dealer neither wins nor the hand ends in a draw (the dealer keeps the deal in both of those cases); when everyone has dealt, the round wind changes. That makes 16 hands minimum. Highest chips at the end wins the match!"]},{title:"House rules in this app",paragraphs:["These rules follow Tea Base's Hong Kong style booklet:","Seat winds matter: a pong of YOUR seat wind scores a fan (other winds score nothing). Your seat flower (matching your seat number from the dealer) scores a fan; no flowers at all also scores a fan.",'Honour eyes: if your pair is winds or dragons, the hand cannot count the "common hand" (all runs) fan — a plain hand with honour eyes scores 0.',"Collecting all 8 flowers is an instant 8-fan win, even with an incomplete hand."]}],Si=[{id:"welcome",text:"Welcome to the table! This is Hong Kong mahjong from your seat. Your 13 tiles are at the bottom — tap the ⓘ button any time for the full rules.",anchor:"rack"},{id:"goal",text:"Your goal: collect 4 sets (runs of 3 like 4-5-6, or triplets) plus a pair. The coach panel below will guide every move.",anchor:"rack"},{id:"explain",text:'Feeling lost? Tap "Explain my hand" on the coach bar any time — the coach breaks down what you have, what to keep building, and which bonus points (fan) are within reach.',anchor:"coach"},{id:"table",text:"The other three players are around the table. Play moves counter-clockwise; watch their discards appear in the middle.",anchor:"discards"},{id:"compass",text:"The centre shows the round wind, whose turn it is, and how many tiles are left in the wall.",anchor:"compass"},{id:"go",text:"When it's your turn, tap a tile to select it, then tap again to discard. Your newly drawn tile glows and sits slightly apart on the right. Good luck — sik wu! 食糊",anchor:"rack"}],Up=[{fan:"0",name:"Chicken hand",cantonese:"gai wu 鸡糊",note:"A mix of runs and triplets across suits with no pattern. Also: any plain hand using winds/dragons as the pair."},{fan:"1",name:"Common hand (all runs)",cantonese:"ping wu 平糊",note:"Every set is a run of ascending numbers (pair must not be honours)."},{fan:"1",name:"Concealed hand",cantonese:"mun ching 门前清",note:"No claimed sets before winning."},{fan:"1",name:"Self draw",cantonese:"zi mo 自摸",note:"You drew the winning tile yourself."},{fan:"1",name:"Dragon pong / Seat wind pong",cantonese:"faan pai 番牌",note:"A pong/gong of any dragon, or of your own seat wind."},{fan:"1",name:"Gong",note:"Each four-of-a-kind."},{fan:"1",name:"Seat flower",note:"A flower whose number matches your seat (dealer is 1)."},{fan:"1",name:"No flowers",note:"Finishing with no flower tiles at all."},{fan:"1",name:"Robbing the gong",cantonese:"cheung gong 搶槓",note:"Winning on the tile someone adds to their pong."},{fan:"1",name:"Win after gong",cantonese:"gong seung zi mo 槓上自摸",note:"Winning on the replacement tile drawn after a gong."},{fan:"1",name:"Last tile win",cantonese:"hoi dai lao yuet 海底捞月",note:"Winning on the final tile of the wall."},{fan:"1",name:"Mixed terminals",cantonese:"wun yiu gau 混幺九",note:"Only 1s, 9s and honour tiles."},{fan:"2",name:"Full flower set",cantonese:"yut toi fa 一台花",note:"All four flowers of one kind (1-2-3-4)."},{fan:"3",name:"All pongs",cantonese:"dou dou wu 对对糊",note:"Every set is a pong/gong (all triplets)."},{fan:"3",name:"Mixed one suit",cantonese:"wun yut sik 混一色",note:"One suit plus honour tiles only."},{fan:"5",name:"Small dragons",cantonese:"siu saam yuen 小三元",note:"Pongs of two dragons + pair of the third."},{fan:"6",name:"Small winds",cantonese:"siu sei hei 小四喜",note:"Pongs of three winds + pair of the fourth."},{fan:"7",name:"Pure one suit",cantonese:"ching yut sik 清一色",note:"One suit only, no honours."},{fan:"7",name:"Seven pairs",cantonese:"七对子",note:"Seven pairs, fully concealed."},{fan:"8",name:"Great dragons",cantonese:"dai saam yuen 大三元",note:"Pongs of all three dragons."},{fan:"8",name:"Gong on gong win",cantonese:"槓上槓自摸",note:"Two gongs in a row, winning on the second replacement tile."},{fan:"8",name:"All eight flowers",cantonese:"dai fa wu 大花糊",note:"Collect all 8 flowers — instant win, even with an incomplete hand."},{fan:"8",name:"Concealed all pongs",cantonese:"kan kan wu 坎坎糊",note:"Fully concealed hand of triplets only."},{fan:"10",name:"All honours",cantonese:"zi yut sik 字一色",note:"Winds and dragons only."},{fan:"10",name:"Pure terminals",cantonese:"ching yiu gau 清幺九",note:"Only 1s and 9s."},{fan:"13 (limit)",name:"Heavenly hand",cantonese:"tin wu 天糊",note:"Dealer wins with the opening hand."},{fan:"13 (limit)",name:"Earthly hand",cantonese:"dei wu 地糊",note:"Winning on the first discard of the hand."},{fan:"13 (limit)",name:"Great winds",cantonese:"dai sei hei 大四喜",note:"Pongs of all four winds."},{fan:"13 (limit)",name:"Thirteen orphans",cantonese:"sup sam yew 十三幺",note:"One of each 1, 9 and honour + a pair of any of them."}],Bp="Payouts double per fan: 0 fan = 1 chip, 1 fan = 2, 2 = 4, 3 = 8… capped at the 13-fan
